[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workpilot"
version = "0.1.0"
description = "Evidence-gated agent for project knowledge work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
database = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
]

[project.scripts]
workpilot = "workpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/workpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
